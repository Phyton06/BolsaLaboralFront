<!-- Navbar -->
<header class="sticky top-0 z-40 flex h-16 items-center justify-between bg-card border-b border-border">
  <div class="flex items-center gap-3">
    <button (click)="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-muted/50">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <h1 class="text-xl font-bold text-utc-primary">Bolsa Laboral</h1>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-sm text-muted-foreground">{{ username }}</span>
    <button (click)="logout()" class="px-3 py-1.5 text-sm font-medium text-foreground hover:bg-muted rounded-lg transition-colors">
      Cerrar sesi&oacute;n
    </button>
  </div>
</header>

<!-- Contenedor principal -->
<div class="relative flex min-h-[calc(100vh-4rem)]">
  <!-- Sidebar (mobile: overlay, desktop: fixed) -->
  <aside
    class="fixed inset-y-0 left-0 z-50 w-64 bg-card border-r border-border transform transition-transform duration-200 ease-in-out md:relative md:translate-x-0 md:z-0"
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen"
  >
    <!-- Mobile overlay -->
    <div class="fixed inset-0 bg-black/50 md:hidden" (click)="toggleSidebar()" *ngIf="sidebarOpen"></div>

    <!-- Sidebar content -->
    <nav class="relative z-10 p-4 space-y-1">
      <a routerLink="/inicio" routerLinkActive="bg-primary/20 text-primary"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Inicio
      </a>

      <!-- Candidato menu -->
      <ng-container *ngIf="isCandidate">
        <a routerLink="/ofertas" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Ofertas
        </a>
        <a routerLink="/mis-postulaciones" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Mis Postulaciones
        </a>
      </ng-container>

      <!-- Empresa menu -->
      <ng-container *ngIf="isEmpresa">
        <a routerLink="/mis-ofertas" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          Mis Ofertas
        </a>
        <a routerLink="/gestion-postulaciones" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Gestionar Postulaciones
        </a>
      </ng-container>

      <!-- Common menu -->
      <a routerLink="/mi-perfil" routerLinkActive="bg-primary/20 text-primary"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Mi Perfil
      </a>

      <!-- Admin menu -->
      <ng-container *ngIf="isAdmin">
        <div class="pt-4 mt-4 border-t border-border">
          <p class="px-3 text-xs font-semibold text-muted-foreground uppercase tracking-wider">Administraci&oacute;n</p>
        </div>
        <a routerLink="/admin/usuarios" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          Usuarios
        </a>
        <a routerLink="/admin/estadisticas" routerLinkActive="bg-primary/20 text-primary"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-foreground hover:bg-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          Estad&iacute;sticas
        </a>
      </ng-container>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 p-4 bg-background min-h-full">
    <router-outlet></router-outlet>
  </main>
</div>
