<!-- Navbar -->
<header class="topbar">
  <div class="topbar-left">
    <img src="assets/img/logo-ut-full.png" alt="UT de la Costa" class="logo" />
  </div>
  <div class="topbar-right">
    <div class="user-dropdown-wrapper" (click)="toggleUserMenu()">
      <span class="user-name">{{ userName }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="dropdown-arrow" [class.open]="userMenuOpen()">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
    @if (userMenuOpen()) {
      <div class="user-dropdown">
        <button (click)="logout()" class="dropdown-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>

<!-- Contenedor principal -->
<div class="shell">
  <!-- Sidebar (siempre visible) -->
  <aside class="sidebar">
    <!-- Sidebar content -->
    <nav class="sidebar-nav">
      @if (userRole === 'empresa') {
        <a routerLink="/empresa/dashboard" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7 7M5 10v-4a2 2 0 012-2h4a2 2 0 012 2v4m-6 0a1 1 0 001 1h2a1 1 0 001-1v-4a1 1 0 00-1-1h-2a1 1 0 00-1 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Dashboard
        </a>
        <a routerLink="/empresa/publicar" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Nueva vacante
        </a>
      } @else if (userRole === 'admin') {
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7 7M5 10v-4a2 2 0 012-2h4a2 2 0 012 2v4m-6 0a1 1 0 001 1h2a1 1 0 001-1v-4a1 1 0 00-1-1h-2a1 1 0 00-1 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Panel Admin
        </a>
      } @else {
        <a routerLink="/inicio" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7 7M5 10v-4a2 2 0 012-2h4a2 2 0 012 2v4m-6 0a1 1 0 001 1h2a1 1 0 001-1v-4a1 1 0 00-1-1h-2a1 1 0 00-1 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Inicio
        </a>
        <a routerLink="/ofertas" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Vacantes
        </a>
        <a routerLink="/mis-postulaciones" routerLinkActive="active" class="sidebar-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Mis Postulaciones
        </a>
      }

      <a routerLink="/mi-perfil" routerLinkActive="active"
         class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Mi Perfil
      </a>

      <!-- Recursos section -->
      <div class="sidebar-group">Recursos</div>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main">
    <router-outlet></router-outlet>
  </main>

  <!-- AI Advisor FAB -->
  <button
    (click)="openAI()"
    class="ai-fab"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M12 2c1 4 4 5 4 9a4 4 0 11-8 0c0-4 3-5 4-9z" />
    </svg>
    <span>Asesor IA</span>
  </button>

  <!-- AI Advisor Modal -->
  <app-ai-advisor [isOpen]="aiOpen()" (isOpenChange)="aiOpen.set($event)"></app-ai-advisor>
</div>
