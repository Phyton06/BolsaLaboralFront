<div class="card">
  <div class="card-h">
    <app-icon [name]="'star'" [size]="18" />
    <h3>Habilidades</h3>
    @if (saving()) {
      <span class="saving-indicator">Guardando...</span>
    }
  </div>
  <hr class="divider" />

  <div class="categorias">
    @for (cat of categorias; track cat) {
      <div class="categoria">
        <div class="categoria-header">
          <app-icon [name]="categoriaIcons[cat]" [size]="14" />
          <span>{{ categoriaLabels[cat] }}</span>
        </div>

        <!-- Chips -->
        <div class="chips-list">
          @for (skill of habilidades()?.[cat]; track skill; let i = $index) {
            <span class="chip-wrapper">
              <app-chip [color]="cat === 'tecnicas' ? 'brand' : cat === 'blandas' ? 'ok' : 'info'">
                {{ skill }}
              </app-chip>
              <button class="chip-remove" (click)="removeSkill(cat, i)" title="Eliminar">
                <app-icon [name]="'x'" [size]="10" />
              </button>
            </span>
          } @empty {
            <span class="empty-cat">Sin habilidades</span>
          }
        </div>

        <!-- Add input -->
        <div class="add-skill">
          <input
            type="text"
            [placeholder]="'Agregar ' + categoriaLabels[cat].toLowerCase() + '...'"
            [(ngModel)]="newInputs()[cat]"
            (keyup.enter)="onEnter(cat, $event)"
          />
          <button class="btn sm ghost" (click)="addSkill(cat)">
            <app-icon [name]="'plus'" [size]="12" />
          </button>
        </div>
      </div>
    }
  </div>
</div>
