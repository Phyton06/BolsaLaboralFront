<div class="min-h-screen flex items-center justify-center bg-[var(--ink-50)] p-4">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-[var(--ink-200)] bg-white shadow-sm overflow-hidden">
      <div class="px-6 py-6 text-center border-b border-[var(--ink-200)]">
        <h1 class="text-2xl font-bold text-[var(--brand-700)]">Recuperar contraseña</h1>
        <p class="text-sm text-[var(--ink-500)] mt-1">Ingresa tu correo y te enviaremos un enlace</p>
      </div>

      <!-- Success message -->
      @if (enviado()) {
        <div class="p-6 text-center">
          <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
            <svg class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <p class="text-lg font-medium text-[var(--ink-800)]">Correo enviado</p>
          <p class="text-sm text-[var(--ink-500)] mt-2">Revisa tu bandeja de entrada y sigue el enlace para restablecer tu contraseña.</p>
          <a routerLink="/login" class="inline-block mt-4 text-[var(--brand-700)] hover:underline text-sm">Volver al inicio de sesión</a>
        </div>
      }

      <!-- Form -->
      @if (!enviado()) {
        <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-[var(--ink-600)] mb-1">Correo electrónico</label>
            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required
              class="w-full h-10 px-3 rounded-lg border border-[var(--ink-200)] bg-white text-[var(--ink-800)] text-base focus:outline-none focus:ring-2 focus:ring-[var(--brand-700)] focus:border-transparent"
              placeholder="tu@email.com" />
          </div>

          <button type="submit" [disabled]="isLoading()"
            class="w-full h-10 px-4 bg-[var(--brand-700)] text-white rounded-lg hover:bg-[var(--brand-800)] text-sm font-medium transition-colors disabled:opacity-50">
            @if (!isLoading()) {
              <span>Enviar enlace</span>
            } @else {
              <span class="flex items-center justify-center gap-2">
                <span class="animate-spin h-4 w-4 border-2 border-white/30 border-t-white rounded-full"></span>
                Enviando...
              </span>
            }
          </button>

          <div class="text-center text-sm pt-2">
            <a routerLink="/login" class="text-[var(--brand-700)] hover:underline">Volver al inicio de sesión</a>
          </div>
        </form>
      }
    </div>
  </div>
</div>
