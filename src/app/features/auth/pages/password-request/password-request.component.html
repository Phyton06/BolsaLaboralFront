<div class="min-h-screen flex items-center justify-center bg-background p-4">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-border bg-card shadow-sm overflow-hidden">
      <div class="px-6 py-6 text-center border-b border-border">
        <h1 class="text-2xl font-bold text-utc-primary">Recuperar contrase&ntilde;a</h1>
        <p class="text-sm text-muted-foreground mt-1">Ingresa tu correo y te enviaremos un enlace</p>
      </div>

      <!-- Success message -->
      <div *ngIf="enviado" class="p-6 text-center">
        <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-900/40 flex items-center justify-center mx-auto mb-4">
          <svg class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <p class="text-lg font-medium text-card-foreground">Correo enviado</p>
        <p class="text-sm text-muted-foreground mt-2">Revisa tu bandeja de entrada y sigue el enlace para restablecer tu contrase&ntilde;a.</p>
        <a routerLink="/login" class="inline-block mt-4 text-primary hover:underline text-sm">Volver al inicio de sesi&oacute;n</a>
      </div>

      <!-- Form -->
      <form *ngIf="!enviado" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-muted-foreground mb-1">Correo electr&oacute;nico</label>
          <input type="email" [(ngModel)]="email" name="email" required
            class="w-full h-10 px-3 rounded-lg border border-border bg-background text-foreground text-base focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="tu@email.com" />
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full h-10 px-4 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 text-sm font-medium transition-colors disabled:opacity-50">
          <span *ngIf="!isLoading">Enviar enlace</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <span class="animate-spin h-4 w-4 border-2 border-primary-foreground/30 border-t-primary-foreground rounded-full"></span>
            Enviando...
          </span>
        </button>

        <div class="text-center text-sm pt-2">
          <a routerLink="/login" class="text-primary hover:underline">Volver al inicio de sesi&oacute;n</a>
        </div>
      </form>
    </div>
  </div>
</div>
