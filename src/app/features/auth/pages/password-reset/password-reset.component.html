<div class="min-h-screen flex items-center justify-center bg-background p-4">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-border bg-card shadow-sm overflow-hidden">

      <!-- Invalid token -->
      <div *ngIf="!tokenValid" class="p-6 text-center">
        <div class="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/40 flex items-center justify-center mx-auto mb-4">
          <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
          </svg>
        </div>
        <p class="text-lg font-medium text-card-foreground">Enlace inv&aacute;lido</p>
        <p class="text-sm text-muted-foreground mt-2">El enlace de recuperaci&oacute;n no es v&aacute;lido o ha expirado.</p>
        <a routerLink="/forgot-password" class="inline-block mt-4 text-primary hover:underline text-sm">Solicitar nuevo enlace</a>
      </div>

      <!-- Form -->
      <form *ngIf="tokenValid" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        <div class="px-6 py-4 text-center border-b border-border -mx-6 -mt-6 mb-4">
          <h1 class="text-2xl font-bold text-utc-primary">Nueva contrase&ntilde;a</h1>
          <p class="text-sm text-muted-foreground mt-1">Ingresa tu nueva contrase&ntilde;a</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-muted-foreground mb-1">Nueva contrase&ntilde;a</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required
            class="w-full h-10 px-3 rounded-lg border border-border bg-background text-foreground text-base focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="M&iacute;nimo 8 caracteres" />
        </div>

        <div>
          <label class="block text-sm font-medium text-muted-foreground mb-1">Confirmar contrase&ntilde;a</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
            class="w-full h-10 px-3 rounded-lg border border-border bg-background text-foreground text-base focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Repite tu contrase&ntilde;a" />
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full h-10 px-4 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 text-sm font-medium transition-colors disabled:opacity-50">
          <span *ngIf="!isLoading">Cambiar contrase&ntilde;a</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <span class="animate-spin h-4 w-4 border-2 border-primary-foreground/30 border-t-primary-foreground rounded-full"></span>
            Guardando...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
