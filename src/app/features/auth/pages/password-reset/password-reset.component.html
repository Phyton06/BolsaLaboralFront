<div class="min-h-screen flex items-center justify-center bg-[var(--ink-50)] p-4">
  <div class="w-full max-w-md">
    <div class="rounded-xl border border-[var(--ink-200)] bg-white shadow-sm overflow-hidden">

      <!-- Invalid token -->
      @if (!tokenValid()) {
        <div class="p-6 text-center">
          <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
            <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
          </div>
          <p class="text-lg font-medium text-[var(--ink-800)]">Enlace inválido</p>
          <p class="text-sm text-[var(--ink-500)] mt-2">El enlace de recuperación no es válido o ha expirado.</p>
          <a routerLink="/forgot-password" class="inline-block mt-4 text-[var(--brand-700)] hover:underline text-sm">Solicitar nuevo enlace</a>
        </div>
      }

      <!-- Form -->
      @if (tokenValid()) {
        <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
          <div class="px-6 py-4 text-center border-b border-[var(--ink-200)] -mx-6 -mt-6 mb-4">
            <h1 class="text-2xl font-bold text-[var(--brand-700)]">Nueva contraseña</h1>
            <p class="text-sm text-[var(--ink-500)] mt-1">Ingresa tu nueva contraseña</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-[var(--ink-600)] mb-1">Nueva contraseña</label>
            <input type="password" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" name="newPassword" required
              class="w-full h-10 px-3 rounded-lg border border-[var(--ink-200)] bg-white text-[var(--ink-800)] text-base focus:outline-none focus:ring-2 focus:ring-[var(--brand-700)] focus:border-transparent"
              placeholder="Mínimo 8 caracteres" />
          </div>

          <div>
            <label class="block text-sm font-medium text-[var(--ink-600)] mb-1">Confirmar contraseña</label>
            <input type="password" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" required
              class="w-full h-10 px-3 rounded-lg border border-[var(--ink-200)] bg-white text-[var(--ink-800)] text-base focus:outline-none focus:ring-2 focus:ring-[var(--brand-700)] focus:border-transparent"
              placeholder="Repite tu contraseña" />
          </div>

          <button type="submit" [disabled]="isLoading()"
            class="w-full h-10 px-4 bg-[var(--brand-700)] text-white rounded-lg hover:bg-[var(--brand-800)] text-sm font-medium transition-colors disabled:opacity-50">
            @if (!isLoading()) {
              <span>Cambiar contraseña</span>
            } @else {
              <span class="flex items-center justify-center gap-2">
                <span class="animate-spin h-4 w-4 border-2 border-white/30 border-t-white rounded-full"></span>
                Guardando...
              </span>
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
